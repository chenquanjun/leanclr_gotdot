# 链式 CI 第 5 段：Android build + export
# 规则：
# 1. 仅在上游 iOS workflow 成功后 / 手动触发
# 2. 单 Job、bash 循环串行 ABI：arm64-v8a → x86_64 → armeabi-v7a
# 3. 任意一个 ABI 构建失败直接退出，不再执行后续 ABI
# 4. 公共准备步骤（依赖、Godot、模板、C#托管程序集）只执行一次，减少 CI 分钟浪费
# 5. 缓存区分【全局共享缓存】和【ABI隔离原生编译缓存】
# 6. 全部 ABI 跑完后统一校验、统一上传产物，减少 artifact 数量
# 7. 增加并发分组，防止同分支多提交并发抢占资源
on:
  workflow_run:
    workflows: ["iOS build"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true # 新提交进来，取消该分支旧的构建；如果需要跑完所有验证改成 false

permissions:
  contents: read
  actions: read

jobs:
  build-export:
    name: Android build + export (sequential ABI)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GODOT_BIN: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # -------------------------- 共享缓存（所有ABI共用，只加载一次） --------------------------
      - name: Cache Godot 4.5 Linux binary
        uses: actions/cache@v4
        with:
          path: .tools/godot45
          key: ${{ runner.os }}-godot45-4.5-stable

      - name: Cache Godot export templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.5.stable
          key: ${{ runner.os }}-godot45-templates-4.5-stable

      - name: Cache BCL
        uses: actions/cache@v4
        with:
          path: godot_project/bin/bcl
          key: ${{ runner.os }}-bcl-${{ hashFiles('native/thirdparty/leanclr/src/libraries/mono-4.5/*.dll', 'native/thirdparty/leanclr/src/libraries/mono-4.5/Facades/netstandard.dll') }}

      # -------------------------- 准备依赖（全局，只跑一次） --------------------------
      - name: Prepare dependencies and BCL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/ensure_deps.ps1
          ./scripts/bootstrap_bcl.ps1

      - name: Build managed assemblies (C#)
        run: dotnet build demo_csharp/LeanClrGame.csproj -c Release -nologo -v:minimal

      # -------------------------- 拉取 Godot 与导出模板（全局，只跑一次） --------------------------
      - name: Fetch Godot 4.5 Linux binary + export templates
        run: |
          set -euo pipefail
          mkdir -p .tools/godot45
          godot_bin="$(find .tools/godot45 -maxdepth 2 -name 'Godot_v4.5-stable_linux.x86_64' -print -quit)"
          if [ -z "$godot_bin" ]; then
            curl -fsSL -o /tmp/godot-linux.zip https://github.com/godotengine/godot-builds/releases/download/4.5-stable/Godot_v4.5-stable_linux.x86_64.zip
            unzip -q /tmp/godot-linux.zip -d .tools/godot45
            godot_bin="$(find .tools/godot45 -maxdepth 2 -name 'Godot_v4.5-stable_linux.x86_64' -print -quit)"
          else
            echo "✅ Godot binary hit cache: $godot_bin"
          fi
          if [ -z "$godot_bin" ]; then echo "❌ Godot Linux binary missing" >&2; exit 1; fi
          chmod +x "$godot_bin"
          echo "GODOT=$PWD/$godot_bin" >> "$GITHUB_ENV"
          echo "GODOT_BIN=$PWD/$godot_bin" >> "$GITHUB_ENV"
          "$PWD/$godot_bin" --version

          tpl_root="$HOME/.local/share/godot/export_templates"
          if [ -f "$tpl_root/4.5.stable/android_debug.apk" ]; then
            echo "✅ Export templates hit cache"
          else
            curl -fsSL -o /tmp/godot-templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.5-stable/Godot_v4.5-stable_export_templates.tpz
            mkdir -p "$tpl_root" /tmp/godot-templates
            rm -rf /tmp/godot-templates/templates
            unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
            mv /tmp/godot-templates/templates "$tpl_root/4.5.stable"
          fi
          ls "$tpl_root/4.5.stable" | sed -n '1,20p'

      # -------------------------- 签名与SDK配置（全局，只跑一次） --------------------------
      - name: Configure debug keystore
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          sed -i 's|^keystore/debug=.*|keystore/debug="'"$HOME"'/.android/debug.keystore"|' godot_project/export_presets.cfg
          grep '^keystore/debug' godot_project/export_presets.cfg

      - name: Inject Android SDK path into Godot editor settings
        run: |
          set -euo pipefail
          "$GODOT" --headless --editor --quit || true
          settings="$(find "$HOME/.config/godot" -maxdepth 1 -name 'editor_settings-*.tres' -print -quit || true)"
          if [[ -z "$settings" ]]; then
            echo "⚠️ No editor settings file found, export may fail without SDK path" >&2
          else
            if grep -q '^export/android/android_sdk_path' "$settings"; then
              sed -i 's|^export/android/android_sdk_path.*|export/android/android_sdk_path = "'"$ANDROID_HOME"'"|' "$settings"
            else
              sed -i '/^\[resource\]/a export/android/android_sdk_path = "'"$ANDROID_HOME"'"' "$settings"
            fi
            grep 'android_sdk_path' "$settings"
          fi

      # -------------------------- 循环串行构建各ABI（核心） --------------------------
      - name: Sequential build native lib + export APK for each ABI
        run: |
          set -euo pipefail
          mkdir -p out/android out/bin/android out/logs
          ABIS=(
            "arm64-v8a|Android arm64-v8a"
            "x86_64|Android x86_64"
            "armeabi-v7a|Android armeabi-v7a"
          )
          for item in "${ABIS[@]}"; do
            IFS='|' read -r ABI PRESET <<< "$item"
            echo -e "\n==================== START BUILD $ABI ===================="

            # ABI独立缓存加载（每个ABI有自己的CMake缓存）
            echo "::group::Cache restore for $ABI"
            cache_key="${{ runner.os }}-android-native-${ABI}-${{ hashFiles('CMakeLists.txt', 'patches/*.patch', 'native/src/**', '.gitmodules') }}"
            echo "Cache key: $cache_key"
            echo "::endgroup::"

            # 编译原生库
            bash scripts/build_android_linux.sh "${ABI}" Debug

            # 导出APK
            apk="out/android/leanclr_codepkg_${ABI}.apk"
            echo "Export preset: $PRESET -> $apk"
            "$GODOT" --headless --path godot_project --export-debug "$PRESET" "$PWD/$apk"
            ls -lh "$apk"

            echo -e "==================== FINISH $ABI ====================\n"
          done

      # -------------------------- 产物校验 --------------------------
      - name: Verify all APKs exist
        run: |
          set -euo pipefail
          declare -a WANT_ABIS=("arm64-v8a" "x86_64" "armeabi-v7a")
          for abi in "${WANT_ABIS[@]}"; do
            f="out/android/leanclr_codepkg_${abi}.apk"
            if [[ ! -f "$f" ]]; then
              echo "❌ Missing APK: $f" >&2
              exit 1
            fi
            echo "✅ Found: $f"
          done

      # -------------------------- 统一上传产物（一次artifact，减少数量） --------------------------
      - name: Upload combined Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: |
            out/android/*.apk
            out/bin/android/
          retention-days: 7
          if-no-files-found: error

      - name: Upload logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs
          path: out/logs/
          retention-days: 7
          if-no-files-found: warn
